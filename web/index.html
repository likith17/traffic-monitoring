<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emergency Routing — Smart Response</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root {
      --bg:#f6f7f9; --surface:#ffffff; --line:#e6e9ee; --ink:#0f172a;
      --muted:#64748b; --accent:#0891b2; --accent-ink:#ffffff;
      --green:#16a34a; --amber:#d97706; --red:#dc2626;
      --radius:12px; --shadow:0 1px 2px rgba(15,23,42,.04), 0 2px 8px rgba(15,23,42,.06);
      --sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    }
    * { box-sizing:border-box; }
    html,body { height:100%; margin:0; }
    body { font-family:var(--sans); background:var(--bg); color:var(--ink);
           display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }

    header { display:flex; align-items:center; gap:10px; padding:14px 20px;
             background:var(--surface); border-bottom:1px solid var(--line); }
    .logo { width:9px; height:9px; border-radius:50%; background:var(--accent); }
    header h1 { font-size:15px; font-weight:650; margin:0; }
    header .sub { color:var(--muted); font-size:13px; }
    header .status { margin-left:auto; color:var(--muted); font-size:12.5px;
                     display:inline-flex; align-items:center; gap:6px; }

    .main { flex:1; display:flex; min-height:0; }
    #map { flex:1; min-width:0; }
    .panel { width:380px; max-width:46vw; background:var(--surface);
             border-left:1px solid var(--line); overflow-y:auto; padding:22px; }
    .leaflet-container { background:#eef1f4; font:inherit; }

    label { display:block; font-size:12px; font-weight:600; color:var(--muted);
            margin:0 0 6px; }
    .field { position:relative; margin-bottom:14px; }
    input { width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:10px;
            background:var(--surface); color:var(--ink); font-size:14.5px; outline:none;
            transition:border-color .15s, box-shadow .15s; }
    input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(8,145,178,.12); }
    .suggest { position:absolute; z-index:1000; left:0; right:0; top:calc(100% + 4px);
               background:var(--surface); border:1px solid var(--line); border-radius:10px;
               box-shadow:var(--shadow); overflow:hidden; display:none; }
    .suggest div { padding:9px 13px; font-size:13.5px; cursor:pointer; }
    .suggest div:hover, .suggest div.active { background:#f1f5f9; }

    .btn { width:100%; padding:12px; border:none; border-radius:10px; cursor:pointer;
           font-size:14.5px; font-weight:650; background:var(--accent); color:var(--accent-ink);
           transition:filter .15s; }
    .btn:hover { filter:brightness(1.06); }
    .btn:disabled { opacity:.55; cursor:default; }
    .btn.ghost { background:var(--surface); color:var(--ink); border:1px solid var(--line);
                 font-weight:600; }

    .divider { height:1px; background:var(--line); margin:22px 0; border:0; }
    .sect-title { font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
                  color:var(--muted); margin:0 0 12px; }

    .metrics { display:none; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .metric b { display:block; font-size:26px; font-weight:680; letter-spacing:-.01em;
                font-variant-numeric:tabular-nums; }
    .metric span { font-size:12px; color:var(--muted); }
    .note { margin-top:14px; font-size:13px; padding:10px 12px; border-radius:10px;
            background:#f1f5f9; }
    .note.good { background:#ecfdf5; color:#065f46; }
    .note.warn { background:#fffbeb; color:#92400e; }
    .note.bad  { background:#fef2f2; color:#991b1b; }
    .blocked { margin:10px 0 0; padding-left:18px; font-size:12.5px; color:var(--muted); }

    .cam { display:none; }
    .cam-head { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
    .cam-head h3 { font-size:14.5px; font-weight:650; margin:0; flex:1; min-width:0;
                   overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .live-dot { width:8px; height:8px; border-radius:50%; background:var(--red);
                display:none; animation:pulse 1.4s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }
    .frame { position:relative; border-radius:10px; overflow:hidden; background:#0b1220;
             aspect-ratio:4/3; display:flex; align-items:center; justify-content:center; }
    .frame img { width:100%; height:100%; object-fit:cover; display:block; }
    .frame .empty { color:#94a3b8; font-size:13px; padding:20px; text-align:center; }
    .cam-stats { display:flex; flex-wrap:wrap; gap:14px; margin:12px 0; font-size:13px; }
    .cam-stats div b { font-size:17px; font-variant-numeric:tabular-nums; }
    .cam-stats div span { color:var(--muted); font-size:11.5px; display:block; }
    .cam-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .placeholder { color:var(--muted); font-size:13px; text-align:center; padding:30px 10px;
                   border:1px dashed var(--line); border-radius:12px; }

    .legend { display:flex; flex-wrap:wrap; gap:8px 16px; font-size:12.5px; color:var(--muted); }
    .legend .k { display:inline-flex; align-items:center; gap:6px; }
    .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
    .err { color:var(--red); font-size:13px; margin-top:10px; display:none; }

    @media (max-width:760px){
      .main{flex-direction:column;} .panel{width:auto;max-width:none;
        border-left:none;border-top:1px solid var(--line);} #map{min-height:44vh;}
    }
  </style>
</head>
<body>
  <header>
    <span class="logo"></span>
    <h1>Emergency Routing</h1>
    <span class="sub">New York City</span>
    <span class="status" id="status">loading…</span>
  </header>

  <div class="main">
    <div id="map"></div>
    <aside class="panel">
      <p class="sect-title">Plan a route</p>
      <div class="field">
        <label for="start">From</label>
        <input id="start" value="Times Square" autocomplete="off" placeholder="Start location">
        <div class="suggest" id="sug-start"></div>
      </div>
      <div class="field">
        <label for="end">To — the incident</label>
        <input id="end" value="Wall Street" autocomplete="off" placeholder="Destination">
        <div class="suggest" id="sug-end"></div>
      </div>
      <button class="btn" id="go">Find route</button>
      <div class="err" id="err"></div>

      <div class="metrics" id="metrics">
        <hr class="divider">
        <div class="grid2">
          <div class="metric"><b id="ourMin">–</b><span>Our ETA · minutes</span></div>
          <div class="metric"><b id="saveMin">–</b><span>Saved vs. shortest</span></div>
          <div class="metric"><b id="km">–</b><span>Distance · km</span></div>
          <div class="metric"><b id="hops">–</b><span>Blocks</span></div>
        </div>
        <div class="note" id="verdict"></div>
        <ul class="blocked" id="blocked"></ul>
      </div>

      <hr class="divider">
      <p class="sect-title">Live camera</p>
      <div class="placeholder" id="camPlaceholder">Click any camera on the map to see live YOLOv12 detection.</div>
      <div class="cam" id="camCard">
        <div class="cam-head">
          <span class="live-dot" id="liveDot"></span>
          <h3 id="camName">Camera</h3>
        </div>
        <div class="frame" id="frame"><div class="empty" id="frameEmpty">loading…</div></div>
        <div class="cam-stats" id="camStats"></div>
        <div class="cam-actions">
          <button class="btn ghost" id="liveBtn">Go live</button>
          <button class="btn ghost" id="scanInc">Scan incidents</button>
        </div>
        <div class="note" id="incVerdict" style="display:none;"></div>
      </div>

      <hr class="divider">
      <div class="legend">
        <span class="k"><span class="dot" style="background:#16a34a"></span>low</span>
        <span class="k"><span class="dot" style="background:#d97706"></span>medium</span>
        <span class="k"><span class="dot" style="background:#dc2626"></span>high</span>
        <span class="k"><span class="dot" style="background:#0891b2;border-radius:2px;width:18px;height:4px"></span>our route</span>
        <span class="k"><span class="dot" style="background:#4f46e5;border-radius:2px;width:18px;height:4px;outline:1px solid #fff"></span>shortest path</span>
      </div>
    </aside>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const $ = id => document.getElementById(id);
    const map = L.map('map', { zoomControl:true }).setView([40.758, -73.978], 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      { maxZoom:19, attribution:'© OpenStreetMap contributors' }).addTo(map);

    const colorFor = s => s == null ? '#94a3b8' : s >= 15 ? '#dc2626' : s >= 5 ? '#d97706' : '#16a34a';
    const routeLayer = L.layerGroup().addTo(map);

    fetch('/api/cameras').then(r => r.json()).then(cams => {
      const layer = L.layerGroup();
      cams.forEach(c => {
        L.circleMarker([c.lat, c.lon], {
          radius:5, color:'#fff', weight:1.2, fillColor:colorFor(c.score), fillOpacity:.9
        }).bindTooltip(`${c.name}${c.score != null ? ' · '+c.score.toFixed(1) : ''}`)
          .on('click', () => openCamera(c)).addTo(layer);
      });
      layer.addTo(map);
      $('status').textContent = `${cams.length} cameras live`;
    });

    // ---- Live camera panel ----
    let currentCam = null, liveTimer = null;

    function setLive(on){
      if (on){
        liveTimer = setInterval(refreshCam, 2500);
        $('liveDot').style.display='inline-block'; $('liveBtn').textContent='Stop';
      } else {
        if (liveTimer) clearInterval(liveTimer); liveTimer=null;
        $('liveDot').style.display='none'; $('liveBtn').textContent='Go live';
      }
    }
    async function refreshCam(){
      if (!currentCam) return;
      try {
        const d = await (await fetch(`/api/camera/${encodeURIComponent(currentCam.id)}/detect`)).json();
        if (!d.ok){ $('frame').innerHTML=`<div class="empty">${d.error||'unavailable'}</div>`; return; }
        if (d.detections > 0 && d.image){
          $('frame').innerHTML = `<img src="${d.image}" alt="detections">`;
        } else if (d.image){
          $('frame').innerHTML =
            `<img src="${d.image}" alt="frame"><div class="empty" style="position:absolute;bottom:6px;left:0;right:0;background:rgba(11,18,32,.6)">no objects detected this frame</div>`;
        } else {
          $('frame').innerHTML = `<div class="empty">frame unavailable</div>`;
        }
        $('camStats').innerHTML =
          `<div><b>${d.detections}</b><span>objects</span></div>`+
          `<div><b>${d.score}</b><span>score</span></div>`+
          `<div><b>${d.vehicles}</b><span>vehicles</span></div>`+
          `<div><b>${d.pedestrians}</b><span>pedestrians</span></div>`;
      } catch(e){ /* keep last frame on a transient error */ }
    }
    function openCamera(c){
      setLive(false);
      currentCam = c;
      $('camPlaceholder').style.display='none';
      $('camCard').style.display='block';
      $('camName').textContent = c.name;
      $('frame').innerHTML = `<div class="empty">running YOLOv12…</div>`;
      $('camStats').innerHTML=''; $('incVerdict').style.display='none';
      refreshCam();
    }
    $('liveBtn').addEventListener('click', () => setLive(!liveTimer));
    $('scanInc').addEventListener('click', async () => {
      if (!currentCam) return;
      const v=$('incVerdict'); v.style.display='block'; v.className='note'; v.textContent='Reviewing frame…';
      try{
        const d = await (await fetch(`/api/camera/${encodeURIComponent(currentCam.id)}/incident`)).json();
        if (!d.ok){ v.className='note warn'; v.textContent=d.error; return; }
        if (d.source!=='vlm'){ v.className='note warn';
          v.textContent=`Vision review unavailable — ${d.note||'no vision model configured'}.`; }
        else if (d.blocking){ v.className='note bad';
          v.textContent=`Possible ${d.category.replace('_',' ')} (${Math.round(d.confidence*100)}%). ${d.note}`; }
        else if (d.category==='heavy_congestion'){ v.className='note warn';
          v.textContent=`Heavy congestion, no blocking incident (${Math.round(d.confidence*100)}%).`; }
        else { v.className='note good';
          v.textContent=`No blocking incident seen (${Math.round(d.confidence*100)}%).`; }
      } catch(e){ v.className='note warn'; v.textContent='Request failed.'; }
    });

    // ---- Type-ahead ----
    function attachSuggest(input, box){
      let items=[], active=-1, timer=null;
      const close=()=>{ box.style.display='none'; active=-1; };
      const render=()=>{
        if(!items.length){ close(); return; }
        box.innerHTML='';
        items.forEach((it,i)=>{
          const el=document.createElement('div'); el.textContent=it.label;
          if(i===active) el.classList.add('active');
          el.addEventListener('mousedown', ev=>{ ev.preventDefault();
            input.value=it.label; input.dataset.lat=it.lat; input.dataset.lon=it.lon; close(); });
          box.appendChild(el);
        });
        box.style.display='block';
      };
      input.addEventListener('input', ()=>{
        input.dataset.lat=''; input.dataset.lon='';
        const q=input.value.trim(); clearTimeout(timer);
        if(q.length<2){ items=[]; close(); return; }
        timer=setTimeout(async ()=>{
          try{ items=await (await fetch(`/api/suggest?q=${encodeURIComponent(q)}`)).json(); }
          catch{ items=[]; } active=-1; render();
        }, 220);
      });
      input.addEventListener('keydown', e=>{
        if(box.style.display!=='block') return;
        if(e.key==='ArrowDown'){ active=Math.min(active+1,items.length-1); render(); e.preventDefault(); }
        else if(e.key==='ArrowUp'){ active=Math.max(active-1,0); render(); e.preventDefault(); }
        else if(e.key==='Enter'&&active>=0){ const it=items[active]; input.value=it.label;
          input.dataset.lat=it.lat; input.dataset.lon=it.lon; close(); e.preventDefault(); }
        else if(e.key==='Escape') close();
      });
      input.addEventListener('blur', ()=>setTimeout(close,150));
    }
    attachSuggest($('start'), $('sug-start'));
    attachSuggest($('end'), $('sug-end'));

    // ---- Routing ----
    const coordsOf = i => { const a=parseFloat(i.dataset.lat), o=parseFloat(i.dataset.lon);
      return (isFinite(a)&&isFinite(o))?{lat:a,lon:o}:null; };
    async function findRoute(){
      $('err').style.display='none'; $('metrics').style.display='none';
      const b=$('go'); b.disabled=true; b.textContent='Planning…';
      try{
        const s=coordsOf($('start')), e=coordsOf($('end'));
        const body={ start:$('start').value, end:$('end').value, compare:true };
        if(s){ body.start_lat=s.lat; body.start_lon=s.lon; }
        if(e){ body.end_lat=e.lat; body.end_lon=e.lon; }
        const d=await (await fetch('/api/route',{method:'POST',
          headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)})).json();
        if(!d.ok){ $('err').textContent=d.error||'Could not plan a route.'; $('err').style.display='block'; return; }
        routeLayer.clearLayers();
        const p=d.payload;
        // White casing under each line so both read clearly on the light basemap.
        // Baseline (shortest path): indigo, dashed. Our route: cyan, solid, on top.
        if(p.baseline_route?.length){
          L.polyline(p.baseline_route,{color:'#ffffff',weight:8,opacity:.85}).addTo(routeLayer);
          L.polyline(p.baseline_route,{color:'#4f46e5',weight:4.5,opacity:1,dashArray:'7 9',lineCap:'round'}).addTo(routeLayer);
        }
        if(p.our_route?.length){
          L.polyline(p.our_route,{color:'#ffffff',weight:9,opacity:.9}).addTo(routeLayer);
          L.polyline(p.our_route,{color:'#0891b2',weight:5.5,opacity:1}).addTo(routeLayer);
        }
        L.marker([p.start.lat,p.start.lon]).addTo(routeLayer).bindTooltip('Start');
        L.marker([p.end.lat,p.end.lon]).addTo(routeLayer).bindTooltip('Incident');
        if(p.bounds) map.fitBounds(p.bounds,{padding:[40,40]});
        $('ourMin').textContent=d.our_minutes; $('saveMin').textContent=d.saved_minutes;
        $('km').textContent=d.km; $('hops').textContent=d.hops;
        const v=$('verdict'); v.className='note '+(d.confirmed?'good':'warn');
        v.textContent=d.confirmed?`Route confirmed clear by camera review.`:`Route could not be fully confirmed — dispatch with caution.`;
        const bl=$('blocked'); bl.innerHTML='';
        d.blocked_cameras.forEach(c=>{ const li=document.createElement('li');
          li.textContent=`Avoided ${c.camera} (${c.reason}, ${c.score})`; bl.appendChild(li); });
        $('metrics').style.display='block';
      } catch(e){ $('err').textContent='Request failed: '+e.message; $('err').style.display='block'; }
      finally{ b.disabled=false; b.textContent='Find route'; }
    }
    $('go').addEventListener('click', findRoute);
  </script>
</body>
</html>
